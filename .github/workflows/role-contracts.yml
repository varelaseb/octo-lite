name: octo-lite contracts

on:
  pull_request:
    paths:
      - roles.toml
      - roles/**
      - agents/**
      - profile/**
      - skills/**
      - scripts/**
      - tests/**
      - .github/workflows/role-contracts.yml
  push:
    paths:
      - roles.toml
      - roles/**
      - agents/**
      - profile/**
      - skills/**
      - scripts/**
      - tests/**
      - .github/workflows/role-contracts.yml

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m unittest discover -s tests -v
      - run: bash -n scripts/install-octo-lite skills/herdr-comms/assets/*
