# Full suite in a clean runner: no spec-chat, annotateanything, or Herdr
# installed (ADR-004 Enforcement). Seam contract tests: tests/test_onboarding.py
# (wake provider present with Herdr, absent without; fresh-install onboarding)
# and tests/test_lane_record.py (lane record and acceptance receipt formats).
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The suite runs in a clone installed as a box's is: skillfile by the command
      # the installer names, then the installer, into a throwaway prefix, fetches
      # Stageshow with its filming dependencies and Chromium, which
      # tests/test_stageshow_film.py films in, and adds the recorder's driver and
      # browser, which tests/test_prototype_video.py records in
      # (spec/domains/install.spec.html #install-peers, #install-recorder,
      # #install-stageshow-browser); then the system libraries those browsers need.
      - run: |
          eval "$(grep '^skillfile_install=' scripts/install-octo-lite)" && sh -c "$skillfile_install"
          PATH="$HOME/.local/bin:$PATH" scripts/install-octo-lite --prefix "$RUNNER_TEMP/home"
          npx playwright-core install-deps chromium
      - run: python3 -m unittest discover -s tests -v
