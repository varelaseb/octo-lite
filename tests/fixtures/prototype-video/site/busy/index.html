<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Week</title>
<style>
  body { margin: 0; padding: 40px 20px; font: 16px system-ui, sans-serif; background: #f6f6f4 }
  .card { width: min(640px, 100%); box-sizing: border-box; padding: 24px; background: #fff; border: 1px solid #ccc;
          border-radius: 8px }
  .card.done { background: #dcfce7 }
</style>
<!-- A card whose press keeps the page too busy to draw for a moment, as a heavy render does. -->
<div class="card">Tuesday</div>
<script>
  const card = document.querySelector('.card')
  card.addEventListener('pointerdown', () => {
    for (const until = Date.now() + 1500; Date.now() < until;);
  })
  card.addEventListener('click', () => card.classList.add('done'))
</script>
