<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Week</title>
<style>
  body { margin: 0; padding: 40px 20px; font: 16px system-ui, sans-serif; background: #f6f6f4 }
  .card { position: relative; width: min(640px, 100%); box-sizing: border-box; padding: 24px; background: #fff;
          border: 1px solid #ccc; border-radius: 8px; cursor: pointer }
  .remove { position: absolute; top: 8px; right: 8px; bottom: 8px; width: 40%; display: none }
  .card:hover .remove { display: block }
</style>
<!-- The week's card with its remove button shown on hover alone, ungated, so on a phone a tap's hover shows it. -->
<div class="card">Tuesday<button class="remove" type="button">Remove</button></div>
<script>
  document.querySelector('.card').addEventListener('click', () => { location.href = '../day/' })
  document.querySelector('.remove').addEventListener('click', e => { e.stopPropagation(); e.target.parentElement.remove() })
</script>
