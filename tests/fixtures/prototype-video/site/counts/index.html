<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discover</title>
<style>
  body { margin: 0; padding: 40px 20px; font: 16px system-ui, sans-serif; background: #f6f6f4 }
  .again { display: block; width: min(640px, 100%); height: 50px; font: inherit; background: #fff }
  .again.counted { background: #16a34a }
</style>
<!-- A search a press runs again, whose counts come back after three slow fixture answers, each read once what the one
     before it brought has drawn: the search, after 1 s, its broader searches, after 0.3 s more, and their counts, after
     4 s more. -->
<button class="again" type="button">Search again</button>
<script>
  const again = document.querySelector('.again')
  const drawn = () => new Promise(done => requestAnimationFrame(() => requestAnimationFrame(done)))
  again.addEventListener('click', async () => {
    for (const ms of [1000, 300, 4000]) {
      await (await fetch(`/answer?ms=${ms}`)).text()
      await drawn()
    }
    again.classList.add('counted')
  })
</script>
